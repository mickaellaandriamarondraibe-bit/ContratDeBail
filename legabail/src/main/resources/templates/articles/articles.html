<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles juridiques - LegaBail</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #1f2933;
        }

        header {
            background: #172033;
            color: white;
            padding: 24px 40px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            color: #d6dce8;
        }

        main {
            max-width: 1000px;
            margin: 32px auto;
            padding: 0 20px;
        }

        .summary {
            margin-bottom: 20px;
            font-size: 16px;
            color: #52606d;
        }

        .article-list {
            display: grid;
            gap: 14px;
        }

        .article-card {
            display: block;
            padding: 18px 20px;
            background: white;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
        }

        .article-card:hover {
            border-color: #2f80ed;
            box-shadow: 0 4px 12px rgba(31, 41, 51, 0.08);
        }

        .article-number {
            font-weight: bold;
            color: #2f80ed;
            margin-bottom: 6px;
        }

        .article-title {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .article-explanation {
            margin: 0;
            color: #52606d;
            line-height: 1.5;
        }

        .empty-state {
            padding: 24px;
            background: white;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            color: #52606d;
        }
    </style>
</head>

<body>
<header>
    <h1>Articles juridiques</h1>
    <p>Liste des articles utilisés par le moteur de règles LegaBail.</p>
</header>

<main>
    <p class="summary" th:if="${articles != null}">
        Nombre d'articles :
        <strong th:text="${#lists.size(articles)}">0</strong>
    </p>

    <div class="empty-state" th:if="${articles == null || #lists.isEmpty(articles)}">
        Aucun article juridique n'est encore disponible.
    </div>

    <section class="article-list" th:if="${articles != null && !#lists.isEmpty(articles)}">
        <a class="article-card"
           th:each="article : ${articles}"
           th:href="@{/articles/{id}(id=${article.id})}">

            <div class="article-number">
                Article <span th:text="${article.numero}">1</span>
            </div>

            <h2 class="article-title" th:text="${article.titre}">
                Titre de l'article
            </h2>

            <p class="article-explanation" th:text="${article.explicationSimple}">
                Explication simple de l'article.
            </p>
        </a>
    </section>
</main>
</body>
</html>
