<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles juridiques - LegaBail</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/articles.css}">
</head>

<body>
<header>
    <h1>Articles juridiques</h1>
    <p>Liste des articles utilisés par le moteur de règles LegaBail.</p>
</header>

<main>
    <p class="summary" th:if="${articles != null}">
        Nombre d'articles :
        <strong th:text="${#lists.size(articles)}">0</strong>
    </p>

    <div class="empty-state" th:if="${articles == null || #lists.isEmpty(articles)}">
        Aucun article juridique n'est encore disponible.
    </div>

    <section class="article-list" th:if="${articles != null && !#lists.isEmpty(articles)}">
        <a class="article-card"
           th:each="article : ${articles}"
           th:href="@{/articles/{id}(id=${article.id})}">

            <div class="article-number">
                Article <span th:text="${article.numero}">1</span>
            </div>

            <h2 class="article-title" th:text="${article.titre}">
                Titre de l'article
            </h2>

            <p class="article-explanation" th:text="${article.explicationSimple}">
                Explication simple de l'article.
            </p>
        </a>
    </section>
</main>
</body>
</html>
