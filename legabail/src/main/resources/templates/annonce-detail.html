<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{locataire/fragments :: head('Annonce')}"></head>
<body>
<header th:replace="~{fragments/header :: navigation}"></header>
<main class="listing-detail-page">
    <a class="back-link" th:href="@{/annonces}">Retour aux annonces</a>
    <div class="listing-detail">
        <div th:replace="~{fragments/galerie :: photos(${annonce.bien}, 'detail-photo')}"></div>
        <section class="detail-panel">
            <div class="listing-tags">
                <span class="listing-tag verified">Première vérification effectuée</span>
                <span class="listing-tag" th:text="${annonce.bien.typeBien}"></span>
            </div>
            <h1 th:text="${annonce.bien.typeBien + ' à ' + annonce.bien.adresse}"></h1>
            <p class="listing-location" th:text="${annonce.bien.adresse}"></p>
            <p class="listing-price"><strong th:text="${annonce.loyer} + ' Ar'"></strong><small>/ mois</small></p>
            <dl class="listing-facts">
                <div><dt>Charges</dt><dd th:text="${annonce.charges} + ' Ar'"></dd></div>
                <div><dt>Caution + avance</dt><dd th:text="${annonce.caution.add(annonce.avance)} + ' Ar'"></dd></div>
                <div><dt>Disponibilité</dt><dd th:text="${annonce.dateDebut}"></dd></div>
                <div><dt>Fin du bail</dt><dd th:text="${annonce.dateFin ?: 'Durée indéterminée'}"></dd></div>
                <div><dt>Mobilier</dt><dd th:text="${annonce.bien.typeLogement.name() == 'MEUBLE' ? 'Meublé avec inventaire' : 'Logement nu'}"></dd></div>
                <div><dt>Sous-location</dt><dd th:text="${annonce.sousLocation ?: 'Non renseignée'}"></dd></div>
            </dl>
            <section th:replace="~{fragments/bien :: details(${annonce.bien})}"></section>
            <div class="listing-notice">Le montant affiché sera repris dans votre formulaire. Vous pourrez accepter les conditions ou demander une modification.</div>
            <a class="btn accent detail-action" th:if="${annonce.statut.name() == 'PUBLIEE'}"
               th:href="@{/annonces/{id}/candidater(id=${annonce.id})}">Candidater pour ce bien</a>
        </section>
    </div>
</main>
<script th:src="@{/js/galerie.js}"></script>
</body>
</html>
