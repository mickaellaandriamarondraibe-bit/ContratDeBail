<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{locataire/fragments :: head('Annonces')}"></head>
<body>
<header th:replace="~{fragments/header :: navigation}"></header>
<main class="listings-page">
    <section class="listings-hero">
        <span class="eyebrow">Locations vérifiées</span>
        <h1>Trouvez un logement avec des conditions faciles à comprendre</h1>
        <p>Chaque annonce publiée a déjà reçu un premier contrôle des règles applicables.</p>
        <div class="listing-search" role="search">
            <label class="sr-only" for="searchLocation">Ville ou quartier</label>
            <input id="searchLocation" type="search" placeholder="Ville ou quartier">
            <label class="sr-only" for="searchType">Type de bien</label>
            <select id="searchType">
                <option value="">Tous les biens</option>
                <option value="Appartement">Appartement</option>
                <option value="Maison">Maison</option>
                <option value="Studio">Studio</option>
                <option value="Local professionnel">Local professionnel</option>
            </select>
            <label class="sr-only" for="searchPrice">Loyer maximal</label>
            <select id="searchPrice">
                <option value="">Tous les prix</option>
                <option value="500000">Jusqu'à 500 000 Ar</option>
                <option value="700000">Jusqu'à 700 000 Ar</option>
                <option value="1000000">Jusqu'à 1 000 000 Ar</option>
                <option value="1500000">Jusqu'à 1 500 000 Ar</option>
            </select>
            <button class="btn accent" id="searchListings" type="button">Rechercher</button>
        </div>
    </section>

    <div class="listing-heading">
        <div>
            <h2>Propositions disponibles</h2>
            <p id="listingCount" th:text="${#lists.size(annonces)} + ' logement(s) trouvé(s)'"></p>
        </div>
        <a class="btn secondary" th:if="${session.bailleurId != null}"
           th:href="@{/bailleur/annonces/nouvelle}">+ Publier mon bien</a>
    </div>

    <p class="listing-empty" id="listingEmpty" th:classappend="${#lists.isEmpty(annonces)} ? '' : ' hidden'">
        Aucune annonce ne correspond à votre recherche.
    </p>

    <div class="listing-grid" id="listingGrid" th:unless="${#lists.isEmpty(annonces)}">
        <article class="listing-card" th:each="a : ${annonces}"
                 th:attr="data-id=${a.id},data-location=${a.bien.adresse},data-type=${a.bien.typeBien},data-price=${a.loyer}">
            <button class="favorite-button" type="button" data-favorite
                    th:attr="aria-label=${'Ajouter ' + a.bien.adresse + ' aux favoris'}"
                    title="Ajouter aux favoris">♡</button>
            <div th:replace="~{fragments/galerie :: photos(${a.bien}, 'listing-photo')}"></div>
            <div class="listing-body">
                <div class="listing-tags">
                    <span class="listing-tag verified">✓ Vérifiée</span>
                    <span class="listing-tag" th:text="${a.bien.typeBien}"></span>
                </div>
                <h3 th:text="${a.bien.typeBien + ' à ' + a.bien.adresse}"></h3>
                <p class="listing-location" th:text="${a.bien.adresse}"></p>
                <p class="listing-price"><strong th:text="${a.loyer} + ' Ar'"></strong><small>/ mois</small></p>
                <a class="btn listing-button" th:href="@{/annonces/{id}(id=${a.id})}">Voir la proposition →</a>
            </div>
        </article>
    </div>
</main>
<script th:src="@{/js/annonces.js}"></script>
<script th:src="@{/js/galerie.js}"></script>
</body>
</html>
