<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{locataire/fragments :: head('Candidature')}"></head>
<body th:class="${session.bailleurId != null ? 'theme-bailleur' : 'theme-locataire'}">
<header th:replace="~{fragments/header :: navigation}"></header>
<main class="shell record-page">
    <div class="record-lead">
        <div>
            <span class="eyebrow">Dossier de location</span>
            <h1 th:text="'Candidature n° ' + ${candidature.id}"></h1>
            <p th:text="${candidature.annonce.bien.adresse}"></p>
        </div>
        <span class="statut" th:text="${candidature.statut}"></span>
    </div>

    <section>
        <h2>Locataire</h2>
        <p><strong th:text="${candidature.locataire.prenom + ' ' + candidature.locataire.nom}"></strong></p>
        <p th:text="${candidature.nombreOccupants} + ' occupant(s) · ' + ${candidature.usagePrevu}"></p>
        <p class="multiligne" th:text="${candidature.message}"></p>
    </section>

    <section>
        <h2 th:text="'Proposition · version ' + ${proposition.numeroVersion}"></h2>
        <dl th:replace="~{locataire/fragments :: conditions(${proposition})}"></dl>
        <div class="agreement-row">
            <p th:text="${proposition.bailleurAccepte ? 'Bailleur : accord enregistré' : 'Bailleur : en attente'}"></p>
            <p th:text="${proposition.locataireAccepte ? 'Locataire : accord enregistré' : 'Locataire : en attente'}"></p>
        </div>
        <div class="actions" th:if="${candidature.statut != 'ACCEPTEE' and candidature.statut != 'REFUSEE'}">
            <form th:if="${estLocataire and !proposition.locataireAccepte}" th:action="@{/propositions/{id}/accepter-locataire(id=${proposition.id})}" method="post">
                <input th:replace="~{locataire/fragments :: csrf}"><button type="submit">Accepter les conditions</button>
            </form>
            <form th:if="${!estLocataire and !proposition.bailleurAccepte}" th:action="@{/propositions/{id}/accepter-bailleur(id=${proposition.id})}" method="post">
                <input th:replace="~{locataire/fragments :: csrf}"><button type="submit">Accepter les conditions</button>
            </form>
            <a class="btn secondary" th:href="@{/candidatures/{id}/negociation(id=${candidature.id})}">Demander une modification</a>
        </div>
        <a class="record-link" th:if="${contrat != null}" th:href="@{/contrats/{id}(id=${contrat.id})}">Consulter et signer le contrat →</a>
    </section>

    <section>
        <h2>Historique des propositions</h2>
        <details th:each="p : ${historique}">
            <summary th:text="'Version ' + ${p.numeroVersion}"></summary>
            <dl th:replace="~{locataire/fragments :: conditions(${p})}"></dl>
            <p th:text="'Accord bailleur : ' + ${p.bailleurAccepte ? 'oui' : 'non'} + ' / Accord locataire : ' + ${p.locataireAccepte ? 'oui' : 'non'}"></p>
        </details>
    </section>
</main>
</body>
</html>
